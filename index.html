<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>구구단 디펜스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="pill hp" title="성 체력">
        <span class="ico">🏰</span>
        <div class="bar"><i id="hpFill"></i><b id="hpText">100/100</b></div>
      </div>
      <div class="pill gold-pill" title="골드"><i class="coin"></i><b id="gold">0</b></div>
      <div class="pill gem-pill" title="보석"><span class="ico">💎</span><b id="gems">0</b></div>
      <div class="pill wave">웨이브 <b id="waveNo">1</b></div>
      <div class="hud-btns">
        <button id="btnSound" class="icon-btn" aria-label="소리">🔊</button>
        <button id="btnPause" class="icon-btn" aria-label="일시정지">⏸</button>
      </div>
    </header>

    <main id="main">
      <div id="stageWrap">
        <canvas id="game"></canvas>
        <canvas id="overlay"></canvas>
        <div id="banner" class="hidden"></div>
        <div id="prepInfo" class="hidden"></div>
      </div>

      <section id="controls">
        <div id="answerRow">
          <div id="answerBox"><span id="answer"></span><span class="caret"></span></div>
          <div id="combo"></div>
        </div>
        <div id="ctrlBody">
          <div id="keypad">
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button data-k="del" class="k-del">⌫</button><button data-k="0">0</button><button data-k="ok" class="k-ok">✔</button>
          </div>
          <div id="side">
            <button id="btnStart" class="big-btn">⚔ 웨이브 시작</button>
            <button id="btnUpgrade" class="big-btn alt">⚒ 강화</button>
            <div id="skills">
              <button class="skill" data-skill="repair" title="성 수리"><span>🔧</span><small>8💎</small></button>
              <button class="skill" data-skill="freeze" title="얼음 폭풍"><span>❄️</span><small>12💎</small></button>
              <button class="skill" data-skill="meteor" title="유성 낙하"><span>☄️</span><small>20💎</small></button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 타이틀 화면 -->
  <div id="title" class="screen">
    <div class="parchment">
      <div class="crest">🏰</div>
      <h1>구구단 디펜스</h1>
      <p class="sub">Multiplication Defense</p>
      <p class="lore">왕국의 성이 위험하다! 다가오는 적의 구구단 문제를 풀어 골드를 모으고,
        궁수탑과 대포를 세워 성을 지켜라!</p>
      <div class="menu">
        <button id="btnContinue" class="big-btn hidden">▶ 이어하기 <small id="continueInfo"></small></button>
        <button id="btnNew" class="big-btn alt">✦ 새 게임</button>
        <button id="btnHelp" class="link-btn">📜 게임 방법</button>
      </div>
      <p id="bestInfo" class="best"></p>
    </div>
  </div>

  <!-- 모달 (건설 / 강화 / 도움말 / 일시정지) -->
  <div id="modal" class="screen hidden">
    <div class="parchment sheet">
      <button class="close" id="modalClose" aria-label="닫기">✕</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 클리어 -->
  <div id="clear" class="screen hidden">
    <div class="parchment clear-card">
      <div class="crest">👑</div>
      <h1>왕국을 지켜냈다!</h1>
      <p class="sub">VICTORY</p>
      <p id="clearStats"></p>
      <div class="menu">
        <button id="btnEndless" class="big-btn">♾ 무한 모드로 계속하기</button>
        <button id="btnClearTitle" class="big-btn alt">🏰 처음 화면으로</button>
      </div>
    </div>
  </div>

  <!-- 게임 오버 -->
  <div id="gameover" class="screen hidden">
    <div class="parchment">
      <h1 class="red">성이 함락되었다!</h1>
      <p id="goStats"></p>
      <div class="menu">
        <button id="btnRetry" class="big-btn">↻ 웨이브 <span id="retryWave"></span>부터 다시 도전</button>
        <button id="btnGoNew" class="big-btn alt">✦ 새 게임</button>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
