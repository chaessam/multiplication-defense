<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="구구단 디펜스">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>구구단 디펜스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="pill hp" title="성 체력">
        <span data-icon="castle"></span>
        <div class="bar"><i id="hpFill"></i><b id="hpText">100/100</b></div>
      </div>
      <div class="pill gold-pill" title="골드"><span data-icon="coin"></span><b id="gold">0</b></div>
      <div class="pill gem-pill" title="보석"><span data-icon="gem"></span><b id="gems">0</b></div>
      <div class="pill wave"><span id="todIcon"></span><span class="wlabel">웨이브</span> <b id="waveNo">1</b><small id="waveMax">/30</small></div>
      <div class="hud-btns">
        <button id="btnFull" class="icon-btn" aria-label="전체화면" data-icon="expand"></button>
        <button id="btnSound" class="icon-btn" aria-label="소리"></button>
        <button id="btnPause" class="icon-btn" aria-label="일시정지" data-icon="pause"></button>
      </div>
    </header>

    <main id="main">
      <div id="stageWrap">
        <canvas id="game"></canvas>
        <canvas id="overlay"></canvas>
        <div id="banner" class="hidden"></div>
        <div id="prepInfo" class="hidden"></div>
        <button id="heroBtn" class="hidden" aria-label="영웅 필살기">
          <span class="ring"></span>
          <span class="face" data-icon="firearrow"></span>
          <span class="lbl">필살기</span>
        </button>
        <div id="bossCut" class="hidden"><div class="slash"></div><div class="txt"><small id="bossCutSub">BOSS</small><b id="bossCutName"></b></div></div>
        <div id="ultDim"></div>
        <div id="flash"></div>
      </div>

      <section id="controls">
        <div id="answerRow">
          <div id="answerBox"><span id="answer"></span><span class="caret"></span></div>
          <div id="combo"></div>
        </div>
        <div id="ctrlBody">
          <div id="keypad">
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button data-k="del" class="k-del" data-icon="back"></button><button data-k="0">0</button><button data-k="ok" class="k-ok" data-icon="check"></button>
          </div>
          <div id="side">
            <button id="btnStart" class="big-btn"></button>
            <button id="btnUpgrade" class="big-btn alt"><span data-icon="anvil"></span> 강화</button>
            <div id="skills">
              <button class="skill" data-skill="repair" title="성 수리"><span data-icon="wrench"></span><small>8</small></button>
              <button class="skill" data-skill="freeze" title="얼음 폭풍"><span data-icon="snow"></span><small>12</small></button>
              <button class="skill" data-skill="meteor" title="유성 낙하"><span data-icon="meteor"></span><small>20</small></button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 타이틀 -->
  <div id="title" class="screen">
    <div class="parchment title-card">
      <div class="crest" data-icon="castle"></div>
      <h1>구구단 디펜스</h1>
      <p class="sub">Multiplication Defense</p>
      <p class="lore">왕국의 성이 위험하다! 다가오는 적의 구구단 문제를 풀어 골드를 모으고, 영웅과 함께 탑을 세워 성을 지켜라!</p>
      <div class="menu">
        <button id="btnContinue" class="big-btn hidden"><span data-icon="play"></span> 이어하기 <small id="continueInfo"></small></button>
        <button id="btnNew" class="big-btn alt"><span data-icon="swords"></span> 새 게임 <small>난이도 · 맵 선택</small></button>
        <div class="menu-row">
          <button id="btnBook" class="mini-btn"><span data-icon="book"></span>도감</button>
          <button id="btnAch" class="mini-btn"><span data-icon="trophy"></span>업적 <small id="achCount"></small></button>
          <button id="btnHelp" class="mini-btn"><span data-icon="scroll"></span>방법</button>
        </div>
        <button id="btnFullTitle" class="full-btn"><span data-icon="expand"></span> 전체화면으로 크게 보기</button>
      </div>
      <p id="playerStats" class="player-stats hidden"></p>
      <p id="bestInfo" class="best"></p>
      <!-- 만든 사람 표시 -->
      <div class="maker">
        <div class="maker-title"><span>기획·제작</span><b>채쌤</b></div>
        <a class="maker-link" href="https://blog.naver.com/ai_classroom" target="_blank" rel="noopener">AI 수업 아카이브 · 채쌤 블로그 ↗</a>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="modal" class="screen hidden">
    <div class="parchment sheet">
      <button class="close" id="modalClose" aria-label="닫기" data-icon="close"></button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 게임 오버 -->
  <div id="gameover" class="screen hidden">
    <div class="parchment">
      <div class="crest" data-icon="skull"></div>
      <h1 class="red">성이 함락되었다!</h1>
      <p id="goStats"></p>
      <div class="menu">
        <button id="btnRetry" class="big-btn"><span data-icon="play"></span> 웨이브 <span id="retryWave"></span>부터 다시 도전</button>
        <button id="btnGoNew" class="big-btn alt"><span data-icon="home"></span> 처음 화면으로</button>
      </div>
    </div>
  </div>

  <!-- 클리어 -->
  <div id="clear" class="screen hidden">
    <div class="parchment clear-card">
      <div class="crest" data-icon="crown"></div>
      <h1>왕국을 지켜냈다!</h1>
      <p class="sub">VICTORY</p>
      <div class="stars big" id="clearStars"></div>
      <p id="clearStats"></p>
      <div class="menu">
        <button id="btnEndless" class="big-btn"><span data-icon="infinity"></span> 무한 모드로 계속하기</button>
        <button id="btnClearTitle" class="big-btn alt"><span data-icon="home"></span> 처음 화면으로</button>
      </div>
      <div class="maker">
        <div class="maker-title"><span>기획·제작</span><b>채쌤</b></div>
        <a class="maker-link" href="https://blog.naver.com/ai_classroom" target="_blank" rel="noopener">AI 수업 아카이브 · 채쌤 블로그 ↗</a>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/models.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
